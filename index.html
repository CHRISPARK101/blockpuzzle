<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121827">
<title>BLOCK PUZZLE</title>
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  /* 세로: 화면 높이에 맞춰 보드 크기 확보 / 가로·작은화면 대응 */
  --chrome:calc(210px + var(--sat) + var(--sab));
  --gw:max(240px,min(calc(100vw - 16px - var(--sal) - var(--sar)),calc((100dvh - var(--chrome))/1.22),540px));
  --cs:40px;
  --gap:12px;
  --pad-x:8px;
}
*{box-sizing:border-box}
html{height:100%;height:100dvh}
body{
  margin:0;
  min-height:100%;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:var(--sat) var(--sar) var(--sab) var(--sal);
  background:radial-gradient(ellipse at 50% 0%,#2a3550 0%,#161d30 45%,#0a0e1b 100%);
  color:#f2f5ff;
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.game{
  width:var(--gw);
  max-width:100%;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  padding:var(--pad-x) 0;
  margin:0 auto;
}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;position:relative}
.stat{border-radius:16px;padding:7px 8px 8px;text-align:center;background:linear-gradient(180deg,#ffffff2e,#ffffff0e);border:1px solid #ffffff3a;box-shadow:inset 0 1px 0 #ffffff40,0 6px 14px #0006}
.stat small{display:block;font-size:11px;font-weight:700;color:#c6cfe6;letter-spacing:.5px}
.stat strong{display:block;font-size:clamp(19px,5.6vw,28px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat.bump strong{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25);color:#ffd86a}}
.brand{text-align:center;line-height:.92;position:relative}
.brand svg{width:clamp(34px,9vw,52px);display:block;margin:0 auto -4px;filter:drop-shadow(0 2px 4px #0008)}
.brand h1{margin:0;font-size:clamp(28px,8.5vw,46px);font-weight:900;letter-spacing:-1px;-webkit-text-stroke:clamp(4px,1.1vw,6px) #2b1259;paint-order:stroke fill;text-shadow:0 4px 0 #1b0b3d}
.brand h1 i{font-style:normal}
.brand p{margin:0;font-size:clamp(17px,5vw,27px);font-weight:900;letter-spacing:1px;color:#fff;-webkit-text-stroke:clamp(3px,.9vw,5px) #3a2a78;paint-order:stroke fill;text-shadow:0 3px 0 #1b0b3d}
.gear{position:absolute;right:0;top:-6px;width:34px;height:34px;border-radius:11px;border:1px solid #ffffff38;background:#ffffff18;color:#dfe6fb;font-size:17px;cursor:pointer}
.frame{position:relative;padding:8px;border-radius:22px;background:linear-gradient(150deg,#a9b4c8,#5b667c 40%,#3a4357 70%,#6c778c);box-shadow:0 12px 30px #000a,inset 0 1px 0 #ffffff80;/* 보드는 JS(--cs)로 정사각 고정 */}
.board{
  display:grid;
  grid-template-columns:repeat(8,var(--cs));
  grid-template-rows:repeat(8,var(--cs));
  width:calc(var(--cs)*8);
  height:calc(var(--cs)*8);
  max-width:100%;
  margin:0 auto;
  background:#0f1525;
  border-radius:14px;
  overflow:hidden;
  box-shadow:inset 0 4px 14px #000c;
  touch-action:none;
  contain:strict;
  flex-shrink:0;
}
.cell{
  position:relative;
  width:var(--cs);
  height:var(--cs);
  /* 테두리는 레이아웃을 차지하지 않는 box-shadow로 처리해 간격 최소화 */
  box-shadow:inset 0 0 0 1px #1f2940;
  overflow:hidden;
  transform:translateZ(0);
}
.f::after,.pv::after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:6px;
  background:radial-gradient(circle at 28% 22%,#ffffff8c,#ffffff00 48%),var(--g);
  border:1px solid #ffffff44;
  box-shadow:inset 0 1px 1px #ffffff80,inset 0 -2px 3px #0005;
}
.pv::after{opacity:.5;box-shadow:none}
.f.pop::after,.f.glow::after,.f.clr::after{will-change:transform,opacity,filter}
.pop::after{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.55);filter:brightness(2)}60%{transform:scale(1.18);filter:brightness(1.5)}100%{transform:scale(1);filter:none}}
.clr::after{animation:clr .36s linear var(--d,0ms) both}
@keyframes clr{0%{transform:scale(1.04);filter:brightness(1.6) sepia(1) saturate(1.6) hue-rotate(150deg);box-shadow:0 0 14px 4px #8fe3ff,inset 0 0 14px #fff}12%{transform:scale(1.04) translate(-1.5px,1px)}22%{transform:scale(1.04) translate(1.5px,-1px)}34%{transform:scale(1.12);filter:brightness(3.4) saturate(0);box-shadow:0 0 22px 8px #fff,inset 0 0 18px #fff;opacity:1}44%{transform:scale(1.4);filter:brightness(4) saturate(0);opacity:0}100%{transform:scale(1.6);opacity:0}}
.c-red{--g:linear-gradient(160deg,#ff8080,#e5262e 60%,#b31220)}
.c-blue{--g:linear-gradient(160deg,#6bb4ff,#1d63e8 60%,#1340ad)}
.c-green{--g:linear-gradient(160deg,#a6ee55,#4fb82a 60%,#2f8a1c)}
.c-orange{--g:linear-gradient(160deg,#ffcb5c,#ff8f1f 60%,#d9620c)}
.c-purple{--g:linear-gradient(160deg,#d197ff,#8c3fe0 60%,#5f26a6)}
.c-cyan{--g:linear-gradient(160deg,#7aebff,#16b0e6 60%,#0b7fb3)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.spark{position:absolute;border-radius:50%;background:radial-gradient(#fff,#a8e9ff 50%,#4cc8ff00 72%);box-shadow:0 0 8px #bff0ff}
.bigflash{position:fixed;inset:0;background:#d8f6ff;opacity:0;pointer-events:none;z-index:40;animation:bf .35s ease-out}@keyframes bf{0%{opacity:.4}100%{opacity:0}}
.shard{position:absolute;background:linear-gradient(135deg,#fff,#c4f1ff 40%,#5cc2f2 75%,#2a8fd0)}.shard.tint{background:var(--g)}.bloom{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffffffee,#9fe6ff88 40%,transparent 70%);mix-blend-mode:screen}.ring{position:absolute;border-radius:50%;border:3px solid #d8f6ff;box-shadow:0 0 14px #5cc8ff,inset 0 0 10px #5cc8ff88}.flash{position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle,#e0f8ffcc,#5cc8ff55 55%,transparent);animation:fl .45s ease-out forwards}@keyframes fl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.ftxt{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);white-space:nowrap;font-size:clamp(26px,8vw,44px);font-weight:900;color:#e6fbff;-webkit-text-stroke:5px #0b5a8a;paint-order:stroke fill;text-shadow:0 4px 0 #063553;animation:ft 1s ease-out forwards;text-align:center;line-height:1.05}
.ftxt small{display:block;font-size:.55em}
@keyframes ft{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.tray{
  display:grid;
  grid-template-columns:1.3fr 1.3fr 1.3fr 1fr 1fr 1fr;
  gap:0;
  padding:8px;
  border-radius:22px;
  background:linear-gradient(180deg,#ffffff26,#ffffff0c);
  border:1px solid #ffffff30;
  box-shadow:inset 0 1px 0 #ffffff30,0 8px 20px #0006;
  contain:layout style;
}
.slot{
  display:flex;
  align-items:center;
  justify-content:center;
  height:calc(var(--cs)*1.7);
  min-height:48px;
  touch-action:none;
  cursor:grab;
  border-radius:14px;
}
.slot.selected{background:#ffffff1c;box-shadow:inset 0 0 0 1px #ffffff55}
.slot.used{opacity:.15;pointer-events:none}
.slot.lift .mini{opacity:.25}
.mini{
  display:grid;
  --ms:calc(var(--cs)*.35);
  grid-auto-rows:var(--ms);
  gap:0;
}
.mini.g{--ms:var(--cs)}
.mc{
  width:var(--ms);
  height:var(--ms);
  border:calc(var(--ms)*.07) solid transparent;
  border-radius:calc(var(--ms)*.24);
  background:radial-gradient(circle at 28% 22%,#ffffff80,#ffffff00 50%) padding-box,var(--g) padding-box;
  box-shadow:inset 0 2px 1px #ffffff90,inset 0 -3px 4px #0005;
  box-sizing:border-box;
}
.mc.e{visibility:hidden}
.ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;filter:drop-shadow(0 10px 10px #000a)}
.hint{text-align:center;color:#aab4d0;font-size:12px;min-height:16px}
.actions{display:flex;gap:10px}
.actions button,.modal button,.modal-btns button{
  flex:1 1 0;
  min-width:0;
  border:1px solid #ffffff2a;
  border-radius:16px;
  padding:12px 6px;
  color:#f4f7ff;
  font-weight:800;
  font-size:13.5px;
  letter-spacing:.2px;
  background:linear-gradient(165deg,#5a6d9a 0%,#3a4668 45%,#2a334d 100%);
  box-shadow:
    inset 0 1px 0 #ffffff55,
    inset 0 -2px 0 #1a2238,
    0 5px 0 #12192b,
    0 8px 18px #00000055;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, filter .15s ease;
  position:relative;
  overflow:hidden;
}
.actions button::after,.modal button::after,.modal-btns button::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,#ffffff18 0%,transparent 45%);
  pointer-events:none;
  border-radius:inherit;
}
.actions button:hover,.modal button:hover,.modal-btns button:hover{filter:brightness(1.08)}
.actions button:active,.modal button:active,.modal-btns button:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1px 0 #ffffff40,
    inset 0 -1px 0 #1a2238,
    0 2px 0 #12192b,
    0 4px 10px #00000044;
}
.modal-btns{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-shrink:0;
  width:100%;
}
.modal-btns button{
  font-size:12.5px;
  padding:12px 8px;
  line-height:1.25;
  white-space:normal;
}
.modal-btns button#m2{
  background:linear-gradient(165deg,#4a5a80 0%,#2c3652 45%,#222b45 100%);
}
.modal-btns.single button{flex:1}
#sound{font-size:17px;padding:10px 0}
.cele{--k:.586;display:none;position:relative;height:96px;margin:0 0 6px;pointer-events:none}
.cele.on{display:block}
.cele::before{content:"";position:absolute;left:50%;bottom:-4px;width:180px;height:30px;transform:translateX(-50%);background:radial-gradient(ellipse,#d8f6ffcc,#5cc8ff55 50%,transparent 72%)}
.cele.sad::before{width:210px;height:34px;background:radial-gradient(ellipse,#1a0826dd,#6a3a9a55 52%,transparent 74%);animation:aura 2.2s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.55;transform:translateX(-50%) scale(.9)}to{opacity:1;transform:translateX(-50%) scale(1.08)}}
.cele .spr{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:none;background-repeat:no-repeat}

.cele i.cf{position:absolute;left:50%;top:0;width:7px;height:11px;border-radius:2px;pointer-events:none;z-index:2}
@media(max-height:620px){.cele{--k:.4;height:64px}}
@media(prefers-reduced-motion:reduce){.cele .spr.win{animation:none;background-position:60% 66.667%}.cele .spr.lose{animation:none;background-position:75% 100%}.cele.sad::before{animation:none}}
.overlay{position:fixed;inset:0;background:#070a14cc;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:50;box-sizing:border-box}
.overlay.show{display:flex}
.modal{width:min(100%,360px);max-height:min(88dvh,100%);padding:20px 20px 20px;border-radius:22px;background:linear-gradient(150deg,#3b475f,#171d2f);border:1px solid #ffffff3a;text-align:center;box-shadow:0 20px 60px #000b;box-sizing:border-box;overflow:visible;display:flex;flex-direction:column}
.modal h2{margin:0 0 8px;font-size:26px;flex-shrink:0}.modal p{color:#cdd6ee;line-height:1.55;margin:0 0 6px}
@media(prefers-reduced-motion:reduce){.pop::after,.clr::after,.stat.bump strong{animation-duration:.01s}}
.modal .ni{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1px solid #ffffff44;background:#0d1322;color:#fff;font-size:16px;text-align:center;-webkit-user-select:text;user-select:text}
.rank{max-height:min(88dvh,100%);display:flex;flex-direction:column;min-height:0;overflow:hidden;padding-bottom:4px}
.tabs{display:flex;gap:6px;margin:6px 0;flex-shrink:0}
.tabs button{margin:0;padding:8px;box-shadow:none;background:#2c3652;opacity:.6;overflow:visible}
.tabs button.on{opacity:1;background:linear-gradient(180deg,#5b6fa8,#34426b)}
#rl{list-style:none;margin:6px 0;padding:0;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;max-height:none;text-align:left}
#rl li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-weight:700}
#rl li:nth-child(odd){background:#ffffff0d}
#rl li.me{background:#ffd45a33;outline:1px solid #ffd45a88}
#rl b{width:30px;text-align:center;color:#ffd86a}
#rl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rl em{font-style:normal;font-variant-numeric:tabular-nums}
#rl li.dim{display:block;text-align:center;color:#aab4d0;font-weight:500;background:none}
.note{font-size:11px;color:#8f9ab8;margin:8px 0 12px;flex-shrink:0;line-height:1.4}
.rank #rclose{
  flex-shrink:0;
  margin-top:auto;
  width:100%;
  min-height:48px;
  padding:12px 8px;
  line-height:1.3;
  font-size:15px;
  overflow:visible;
  /* 하단 그림자가 잘리지 않도록 그림자 축소 */
  box-shadow:
    inset 0 1px 0 #ffffff55,
    inset 0 -1px 0 #1a2238,
    0 3px 0 #12192b,
    0 4px 10px #00000044;
}
.cell.glow::after{animation:gl .4s ease-in forwards}
@keyframes gl{0%{filter:none}100%{transform:scale(1.04);filter:brightness(1.6) sepia(1) saturate(1.6) hue-rotate(150deg);box-shadow:0 0 14px 4px #8fe3ff,inset 0 0 14px #fff}}
.cell.glow::before,.cell.clr::before{content:"";position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,#e8fbffcc,#5cc8ff44 50%,transparent 70%);mix-blend-mode:screen;pointer-events:none;z-index:3;will-change:transform,opacity}
.cell.glow::before{animation:bloom .4s ease-in forwards}
@keyframes bloom{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1.2)}}
.cell.clr::before{animation:bl2 .42s ease-in var(--d,0ms) both}
@keyframes bl2{0%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(2.4)}}
.c-red{--gl:#ff3b4aaa}.c-blue{--gl:#3d8bffaa}.c-green{--gl:#7be035aa}.c-orange{--gl:#ff9a2aaa}.c-purple{--gl:#b05cffaa}.c-cyan{--gl:#38d6ffaa}
.next{display:flex;align-items:center;justify-content:center;gap:16px;height:calc(var(--cs)*1.35);border-radius:16px;background:linear-gradient(180deg,#ffffff14,#ffffff06);border:1px solid #ffffff22}
.next small{font-size:11px;font-weight:800;color:#aab4d0;letter-spacing:1px}
#nx{display:flex;gap:20px;align-items:center}
.next .mini{--ms:calc(var(--cs)*.28);opacity:.9}
.slot.nx{pointer-events:none;filter:grayscale(1) brightness(.9)}
.slot.nx .mini{--ms:calc(var(--cs)*.27)}
.slot.nx:nth-child(4){border-left:1px dashed #ffffff33;border-radius:0}

/* ===== 모바일 반응형 ===== */
/* 좁은 화면 */
@media (max-width:380px){
  :root{--gap:8px;--pad-x:4px;--chrome:calc(190px + var(--sat) + var(--sab))}
  .stat{padding:5px 6px 6px;border-radius:12px}
  .stat small{font-size:10px}
  .actions{gap:6px}

function pickColor(){
  // 최근 2개 색은 후보에서 제외(후보가 너무 줄어들면 1개만 제외)
  const ban = new Set(recentColors.slice(-2));
  let pool = COLORS.filter(c => !ban.has(c));
  if(pool.length === 0) pool = COLORS.slice();
  // 트레이/큐에 이미 있는 색도 가중치 낮춤
  const inPlay = [];
  if(pieces) pieces.forEach(p => { if(p) inPlay.push(p.color); });
  if(queue) queue.forEach(p => { if(p) inPlay.push(p.color); });
  const counts = {};
  COLORS.forEach(c => counts[c] = 0);
  inPlay.forEach(c => { if(counts[c] !== undefined) counts[c]++; });
  // 적게 쓰인 색일수록 높은 가중치
  let total = 0;
  const weights = pool.map(c => {
    const w = 1 / (1 + (counts[c] || 0) * 2);
    total += w;
    return w;
  });
  let r = Math.random() * total;
  let color = pool[0];
  for(let i = 0; i < pool.length; i++){
    r -= weights[i];
    if(r <= 0){ color = pool[i]; break; }
  }
  recentColors.push(color);
  if(recentColors.length > 8) recentColors.shift();
  return color;

  // 0점 → 작은 블록 위주, 점수가 오를수록 큰 블록 가중치 상승 (최대 약 10000점에서 포화)

  let total = 0;
  const weights = PIECE_SIZE.map(sz => {
    const w = Math.pow(sz, bias);
    total += w;
    return w;
  });
  let r = Math.random() * total;
  let i = 0;
  for (; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) break;
  }

function burst(el,pf=1){const col=(el.className.match(/c-(\w+)/)||[])[1]||'orange',fr=frameEl.getBoundingClientRect(),r=el.getBoundingClientRect(),cx=r.left-fr.left+r.width/2,cy=r.top-fr.top+r.height/2,u=r.width,R=(a,b)=>Math.round(a+Math.random()*(b-a));
 const add=(cn,w,x,y)=>{const s=document.createElement('div');s.className=cn;s.style.cssText=`width:${w}px;height:${w}px;left:${x-w/2}px;top:${y-w/2}px`;fxEl.appendChild(s);return s};
 const bl=add('bloom',u*2.4,cx,cy);bl.animate([{transform:'scale(.3)',opacity:1},{transform:'scale(1.7)',opacity:0}],{duration:420,easing:'ease-out'}).onfinish=()=>bl.remove();if(pf>=.6){const rg=add('ring',u*.6,cx,cy);rg.animate([{transform:'scale(.3)',opacity:.95},{transform:'scale(2.8)',opacity:0}],{duration:420,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>rg.remove()}
 const NS=Math.max(3,Math.round(10*pf)),NP=Math.max(3,Math.round(10*pf));
 for(let k=0;k<NS;k++){const tint=k>=NS*.7,s=add('shard '+(tint?'c-'+col+' tint':''),u*(.18+Math.random()*.28),cx,cy),a=Math.random()*6.283,d=u*(1+Math.random()*1.9),x=Math.cos(a)*d,y=Math.sin(a)*d,rot=(Math.random()-.5)*900;
  s.style.clipPath=`polygon(${R(0,30)}% ${R(0,30)}%,${R(70,100)}% ${R(0,40)}%,${R(50,90)}% ${R(70,100)}%,${R(0,30)}% ${R(60,100)}%)`;
  s.animate([{transform:'translate(0,0) rotate(0) scale(1.1)',opacity:1},{transform:`translate(${x}px,${y-u*.4}px) rotate(${rot/2}deg)`,opacity:1,offset:.3,easing:'ease-in'},{transform:`translate(${x*1.2}px,${y+u*2.6}px) rotate(${rot}deg) scale(.4)`,opacity:0}],{duration:650+Math.random()*350,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>s.remove()}
 for(let k=0;k<NP;k++){const z=3+Math.random()*7,s=add('spark',z,cx,cy),a=Math.random()*6.283,d=u*(.6+Math.random()*1.9);
  s.animate([{transform:'translate(0,0) scale(1.3)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-u*.3}px) scale(.1)`,opacity:0}],{duration:600+Math.random()*500,easing:'ease-out'}).onfinish=()=>s.remove()}}
function place(i,r,c){
 if(busy)return false;const p=pieces[i];
 if(!p||!fits(p.shape,r,c)){hint('그 위치에는 놓을 수 없습니다.');beep(150,.12,'square',.03);return false}
 busy=true;selected=-1;const g=gid;
 p.shape.forEach(([y,x])=>grid[r+y][c+x]=p.color);pieces[i]=null;
 let gain=p.shape.length;
 const rows=[],cols=[],clear=new Set();
 for(let y=0;y<N;y++)if(grid[y].every(Boolean))rows.push(y);
 for(let x=0;x<N;x++)if(grid.every(row=>row[x]))cols.push(x);
 rows.forEach(y=>{for(let x=0;x<N;x++)clear.add(y*N+x)});
 cols.forEach(x=>{for(let y=0;y<N;y++)clear.add(y*N+x)});
 render();
 p.shape.forEach(([y,x])=>cells[(r+y)*N+c+x].classList.add('pop'));
 beep(330,.07);
 if(!clear.size){combo=0;score+=gain;finish();hint('좋습니다! 다음 블록을 배치하세요.');return true}
 combo++;const lines=rows.length+cols.length;
 gain+=(clear.size*2+(lines-1)*5)*combo;score+=gain;
 hint(`❄️ ${lines}줄 완성! +${gain}점`+(combo>1?` (콤보 ×${combo})`:''));
 clear.forEach(i=>cells[i].classList.add('glow'));charge();setTimeout(()=>{if(g!==gid)return;let k=0;
  const st=Math.min(30,Math.floor(420/clear.size)),pf=Math.max(.3,Math.min(1,12/clear.size));
  clear.forEach(idx=>{const el=cells[idx];el.style.setProperty('--d',(k++*st)+'ms');el.classList.remove('glow');el.classList.add('clr');const n=k-1;setTimeout(()=>{if(g!==gid)return;burst(el,pf);if(n<10||n%3===0)tink(n)},n*st+130)});
  shake(lines,combo);punch(lines,combo);floatText(combo>1?`COMBO ×${combo}<small>+${gain}</small>`:`+${gain}`);
  beep(140,.25,'sine',.16);setTimeout(()=>{if(g===gid)crash()},130);rows.forEach(y=>beam(true,y));cols.forEach(x=>beam(false,x));try{navigator.vibrate&&navigator.vibrate(lines>1?[25,30,40]:20)}catch(e){}beep(520+combo*90,.2,'triangle',.06);if(lines>1)setTimeout(()=>beep(780+combo*90,.25,'triangle',.05),120);
  setTimeout(()=>{if(g!==gid)return;clear.forEach(idx=>{grid[(idx/N)|0][idx%N]=null;cells[idx].style.removeProperty('--d')});finish()},520+k*st)},420);
 return true}
function finish(){
 if(score>best){recordBroken=true;best=score;try{localStorage.setItem('blockPuzzleBest',best)}catch(e){}}
 let fromR=null;if(pieces.every(x=>!x)){fromR=[...trayEl.querySelectorAll('.slot.nx .mini')].map(e=>e.getBoundingClientRect());pieces=takeBatch()}
 render();
 if(fromR)swapAnim(fromR);bumpScore();busy=false;
 if(!hasMove()){const g=gid;setTimeout(()=>{if(g===gid)gameOver()},500)}}
const hasMove=()=>pieces.some(p=>p&&(()=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(p.shape,r,c))return true;return false})());
function showModal(t,m,b,act,b2,act2){
  $('mt').textContent=t;$('mx').innerHTML=m;$('mok').textContent=b;modalAct=act;modalAct2=act2||null;
  const x=$('m2'),row=$('mbtns');
  x.style.display=b2?'':'none';x.textContent=b2||'';
  if(row)row.classList.toggle('single',!b2);
  $('cele').classList.remove('on');
  $('overlay').classList.add('show');
}
function hideModal(){$('overlay').classList.remove('show');$('cele').classList.remove('on')}
function clearPv(){pvList.forEach(i=>cells[i].className=cls(i));pvList=[]}
function showPv(p,r,c){clearPv();if(!fits(p.shape,r,c))return;p.shape.forEach(([y,x])=>{const i=(r+y)*N+c+x;cells[i].className=cls(i)+' pv c-'+p.color;pvList.push(i)})}
function startDrag(e,i){if(busy||drag||!pieces[i])return;drag={i,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,r:-9,c:-9}}
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id)return;
 if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;drag.moved=true;selected=-1;drag.g=mk(pieces[drag.i],true);drag.g.classList.add('ghost');document.body.appendChild(drag.g);trayEl.children[drag.i].classList.add('lift')}
 const p=pieces[drag.i],cs=boardEl.clientWidth/N,[h,w]=dims(p.shape),
  gx=e.clientX-w*cs/2,gy=e.clientY-h*cs/2-(e.pointerType==='mouse'?0:cs*1.6),br=boardEl.getBoundingClientRect();
 drag.g.style.transform=`translate(${gx}px,${gy}px)`;
 drag.r=Math.round((gy-br.top)/cs);drag.c=Math.round((gx-br.left)/cs);showPv(p,drag.r,drag.c)});
function endDrag(e,cancel){
 if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;clearPv();if(d.g)d.g.remove();
 if(d.moved){lastDrop=Date.now();if(!cancel&&place(d.i,d.r,d.c))return;render()}
 else if(!cancel)selectPiece(d.i)}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
boardEl.addEventListener('click',e=>{if(drag||Date.now()-lastDrop<400)return;const i=cells.indexOf(e.target.closest('.cell'));if(i<0)return;
 if(selected<0){hint('먼저 아래 블록 하나를 선택하세요.');return}place(selected,(i/N)|0,i%N)});
function startBgm(){
  if(!bgmEl||!sound)return;
  // iOS: 사용자 제스처 안에서 play() 호출 필요. 실패해도 다음 터치에서 재시도
  const p = bgmEl.play();
  if(p && p.then){
    p.then(()=>{ bgmStarted=true; }).catch(()=>{ bgmStarted=false; });
  } else {
    bgmStarted = true;
  }
  // 효과음용 AudioContext도 함께 깨움
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
  }catch(e){}
}
function setSoundUI(){
  const b=$('sound');
  b.textContent=sound?'🔊':'🔇';
  b.setAttribute('aria-label',sound?'효과음 끄기':'효과음 켜기');
  if(bgmEl){
    if(sound) startBgm();
    else bgmEl.pause();
  }
}
$('restart').onclick=()=>{startBgm();newGame()};
$('m2').onclick=()=>{hideModal();if(modalAct2)modalAct2()};
$('rank').onclick=()=>{startBgm();openRank()};
$('tw').onclick=()=>setTab(true);$('ta').onclick=()=>setTab(false);
$('rclose').onclick=()=>{$('rk').classList.remove('show');if(over)newGame()};
$('mok').onclick=()=>{hideModal();if(modalAct)modalAct()};
$('sound').onclick=e=>{sound=!sound;setSoundUI()};
// 첫 터치/클릭 시 배경음악 시작 (브라우저·iOS 자동재생 정책)
function unlockAudio(){
  if(!sound || bgmStarted) return;
  startBgm();
}
['pointerdown','touchstart','click','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, {passive:true});
});
newGame();
if(location.hash==='#win')previewEnd(true);else if(location.hash==='#lose')previewEnd(false);
})();
